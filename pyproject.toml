[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostromo"
version = "0.2.0"
description = "Sandbox de ejecución aislada con Bubblewrap y evaluador de casos de prueba .in/.out"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@cf49348fae40d264006fe07dee2cc9e88dd9c934",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/nostromo"
Repository = "https://github.com/INGCOM-UNRN-P1/nostromo.git"
Issues = "https://github.com/INGCOM-UNRN-P1/nostromo/issues"

[project.scripts]
nostromo = "nostromo.cli:main"

[project.entry-points."ripley.plugins"]
sandbox = "nostromo.ripley_plugin:NostromoPlugin"

[dependency-groups]
# En `dependency-groups` (PEP 735) y no en `optional-dependencies`: uv instala
# este grupo con un `uv sync` a secas, de modo que el venv del repo queda listo
# para correr la suite. Como extra opcional había que acordarse de
# `--extra dev`, y sin eso `.venv/bin/python -m pytest` fallaba con
# "No module named pytest".
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nostromo"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
# yutani es una referencia directa a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
